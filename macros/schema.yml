version: 2

# Argument names and types here are validated by dbt against each macro's signature (dbt >= 1.10 warns
# on a mismatch; dbt 2.x - Fusion - is stricter). Keep them in sync with the macro definitions.
# Types must come from dbt's grammar: string, bool, int, any, list[...], dict[string,any].

macros:
  # ------------------------------------------------------------ report
  - name: report
    description: "Top-level assembler. Turns pages into a report in Sigma's code representation - the request body of `POST /v2/reports` - and validates it at parse time (empty report or page, duplicate page names, an element placed twice, content that does not fit its page)."
    arguments:
      - name: name
        type: string
        description: "Report name in Sigma."
      - name: pages
        type: list[any]
        description: "List of `sigma_report.page(...)`. Page names must be unique."
      - name: theme
        type: dict[string,any]
        description: "Per-report theme overrides, deep-merged over the `sigma_report_theme` project var."
      - name: folder_id
        type: string
        description: "Sigma folder id. Defaults to the `sigma_folder_id` project var."
      - name: report_id
        type: string
        description: "An existing Sigma report id, to update it instead of creating a new one. Omit on first create."
      - name: description
        type: string
        description: "Description text."
      - name: page_size
        type: any
        description: "`letter` (default), `legal`, `tabloid`, `a4`, `a3`, `screen`, or a {width, height} mapping in pixels."
      - name: orientation
        type: string
        description: "`portrait` or `landscape`; none keeps the preset's own shape."
      - name: margin
        type: int
        description: "Page margin in pixels."
      - name: gap
        type: int
        description: "Space between blocks (or between a row's elements) in pixels. Defaults to the report's gap."
      - name: header
        type: any
        description: "Elements / rows for a header panel repeated on every page. none = no header."
      - name: footer
        type: any
        description: "Elements / rows for a footer panel repeated on every page. none = no footer."
      - name: header_height
        type: int
        description: "Header panel height in pixels."
      - name: footer_height
        type: int
        description: "Footer panel height in pixels."
      - name: schedules
        type: list[any]
        description: "`schedule(...)` results: scheduled PDF exports, carried on the spec beside `contents` and applied by the export script."
  - name: page
    description: "One page of a report: a name and the blocks (elements and rows) stacked on it, top to bottom. With `paginate=true` it continues onto further physical pages when it is taller than one."
    arguments:
      - name: name
        type: string
        description: "Page name."
      - name: blocks
        type: list[any]
        description: "Elements, rows and/or lists of them, in reading order. Must not be empty."
      - name: key
        type: string
        description: "Identity the page id is derived from; defaults to the name. Set it if you rename a page and want to keep its id."
      - name: paginate
        type: bool
        description: "Let the page continue onto further pages instead of failing when its content is too tall."
  - name: materialize
    description: "Attaches a composed spec to the calling model's `meta.sigma_report` (via `config(meta=...)`, which replaces `meta` wholesale). The spec lands in `manifest.json` on `dbt parse`."
    arguments:
      - name: spec
        type: any
        description: "A report spec built by `report()` (or a `simple_*` composite); for `*_from_spec`, a mapping of that macro's arguments."
      - name: materialized
        type: string
        description: "dbt materialization for the (otherwise empty) model. Default `view`; `ephemeral` creates nothing in the warehouse."

  # ------------------------------------------------------------ layout
  - name: row
    description: "A horizontal band of blocks (elements, rows, stacks) sharing the width equally or by relative `widths`. Every child is stretched to the height of the row."
    arguments:
      - name: elements
        type: list[any]
        description: "Elements and/or lists of elements."
      - name: widths
        type: list[any]
        description: "Relative weights, one per element. Default: equal."
      - name: gap
        type: any
        description: "Space between the elements in pixels. Defaults to the report's gap."
      - name: pad
        type: int
        description: "Trailing empty weight, so a short row keeps the cell width of the rows above it."
  - name: stack
    description: "A vertical group of blocks (elements, rows, stacks). Children keep their natural heights; flexible ones share any extra."
    arguments:
      - name: elements
        type: list[any]
        description: "Elements and/or lists of elements (not rows or stacks)."
      - name: gap
        type: any
        description: "Space between the stacked elements in pixels."
  - name: flex
    description: "Makes a block flexible: it takes a share of the leftover height, in proportion to `weight`, and is never smaller than `min`."
    arguments:
      - name: block
        type: any
        description: "An element, row or stack built by a sigma_report macro."
      - name: weight
        type: any
        description: "Relative share of the leftover space (default 1)."
      - name: min
        type: any
        description: "The smallest the block may be, in pixels (default: its natural height)."
  - name: at
    description: "Pins an element at an absolute position on its page, outside the flow. With `overlap=true` it may overlap flowed content."
    arguments:
      - name: element
        type: any
        description: "An element built by a sigma_report macro."
      - name: x
        type: any
        description: "The category or time axis, as a field."
      - name: y
        type: any
        description: "The measure, or a list of measures."
      - name: width
        type: any
        description: "Width in pixels."
      - name: height
        type: any
        description: "Height in pixels."
      - name: overlap
        type: bool
        description: "True if this element is meant to overlap other content, so the geometry check allows it."
  - name: page_break
    description: "Starts a new physical page here. Needs `paginate=true` on the page; does nothing on an empty page."
  - name: page_dimensions
    description: "The page size in pixels (96 per inch) for a preset name or a {width, height} mapping, with an optional orientation."
    arguments:
      - name: page_size
        type: any
        description: "Preset name or {width, height} mapping."
      - name: orientation
        type: string
        description: "`portrait` or `landscape`; none keeps the preset's own shape."

  # ------------------------------------------------------------ sources
  - name: warehouse_table
    description: "A warehouse table addressed by its physical [database, schema, table] path."
    arguments:
      - name: path
        type: any
        description: "[database, schema, table] for a warehouse table; for `freeze_id`, the stable path string to hash."
      - name: connection_id
        type: string
        description: "Sigma connection id. Defaults to the `sigma_connection_id` project var."
  - name: relation_path
    description: "The one place the package decides the physical path of a dbt node. Dispatched: override `default__relation_path` in your own project to change it."
    arguments:
      - name: kind
        type: string
        description: "'ref' or 'source' for `relation_path`; an element kind (`bar-chart`, `text`, ...) elsewhere."
      - name: name
        type: string
        description: "The model name, or 'source_name.table_name' for a source."
      - name: database
        type: string
        description: "Database; defaults to the target's."
      - name: schema
        type: string
        description: "Schema; defaults to the target's."
      - name: identifier
        type: string
        description: "Table name; defaults to the node's name."
  - name: default__relation_path
    description: "The package's default for `relation_path`: the target's database and schema, and the node's name as the table."
    arguments:
      - name: kind
        type: string
        description: "'ref' or 'source' for `relation_path`; an element kind (`bar-chart`, `text`, ...) elsewhere."
      - name: name
        type: string
        description: "The model name, or 'source_name.table_name' for a source."
      - name: database
        type: string
        description: "Database; defaults to the target's."
      - name: schema
        type: string
        description: "Schema; defaults to the target's."
      - name: identifier
        type: string
        description: "Table name; defaults to the node's name."
  - name: from_ref
    description: "A dbt model, seed or snapshot as a warehouse table. Calls `ref()` so the report sits downstream of it in the DAG."
    arguments:
      - name: model_name
        type: string
        description: "Name of the dbt model."
      - name: database
        type: string
        description: "Database; defaults to the target's."
      - name: schema
        type: string
        description: "Schema; defaults to the target's."
      - name: identifier
        type: string
        description: "Table name; defaults to the node's name."
      - name: connection_id
        type: string
        description: "Sigma connection id. Defaults to the `sigma_connection_id` project var."
  - name: from_source
    description: "A dbt source as a warehouse table. Calls `source()` for lineage."
    arguments:
      - name: source_name
        type: string
        description: "Name of the dbt source."
      - name: table_name
        type: string
        description: "The table's display name in the data model, if it was given a custom `display_name`."
      - name: database
        type: string
        description: "Database; defaults to the target's."
      - name: schema
        type: string
        description: "Schema; defaults to the target's."
      - name: identifier
        type: string
        description: "Table name; defaults to the source table's name."
      - name: connection_id
        type: string
        description: "Sigma connection id. Defaults to the `sigma_connection_id` project var."
  - name: data_model
    description: "A table inside a Sigma data model, addressed by its id and the table key it was given in `sigma_data_models.table()`."
    arguments:
      - name: data_model_id
        type: string
        description: "The Sigma data model id."
      - name: table_key
        type: string
        description: "The `key` the table was given in `sigma_data_models.table()`."
      - name: identifier
        type: string
        description: "Table name; defaults to the node's name."
      - name: database
        type: string
        description: "Database; defaults to the target's."
      - name: schema
        type: string
        description: "Schema; defaults to the target's."
      - name: table_name
        type: string
        description: "The table's display name in the data model, if it was given a custom `display_name`."
  - name: from_data_model
    description: "`data_model` for a dbt model built with `sigma_data_models.materialize()`: `ref()`s it for lineage and looks its Sigma data model id up in the `sigma_data_model_ids` project var."
    arguments:
      - name: model_name
        type: string
        description: "Name of the dbt model."
      - name: table_key
        type: string
        description: "The `key` the table was given in `sigma_data_models.table()`."
      - name: data_model_id
        type: string
        description: "The Sigma data model id."
      - name: identifier
        type: string
        description: "Table name; defaults to the node's name."
      - name: database
        type: string
        description: "Database; defaults to the target's."
      - name: schema
        type: string
        description: "Schema; defaults to the target's."
      - name: table_name
        type: string
        description: "The table's display name in the data model, if it was given a custom `display_name`."
  - name: element
    description: "Another element in the same report as a source - a chart or KPI built on a table that is already on the page."
    arguments:
      - name: el
        type: any
        description: "An element built by a sigma_report macro."
  - name: resolve_source
    description: "Normalizes anything passed as `source=` (a source or an element) into a source dict. Raises on anything else."
    arguments:
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: where
        type: string
        description: "Name of the calling macro, for error messages."

  # ------------------------------------------------------------ fields
  - name: field
    description: "A column or formula with an optional display name, format and description. A bare string is accepted anywhere a field is."
    arguments:
      - name: formula
        type: string
        description: "A Sigma formula."
      - name: name
        type: string
        description: "Display name of the column."
      - name: format
        type: any
        description: "A `sigma_report.format_*()` result."
      - name: description
        type: string
        description: "Column description."
  - name: format_number
    description: "A number format from a d3 format string, with optional prefix, suffix and null display."
    arguments:
      - name: pattern
        type: string
        description: "A d3 format string (numbers) or d3 time format (dates)."
      - name: prefix
        type: string
        description: "Text before the number."
      - name: suffix
        type: string
        description: "Text after the number."
      - name: null_as
        type: string
        description: "Display value for nulls."
  - name: format_integer
    description: "1,234,567"
  - name: format_currency
    description: "$1,234 (or $1,234.50 with decimals=2)."
    arguments:
      - name: decimals
        type: int
        description: "Digits after the decimal point."
      - name: symbol
        type: string
        description: "Currency symbol."
  - name: format_percent
    description: "12.3% - the value is a fraction (0.123)."
    arguments:
      - name: decimals
        type: int
        description: "Digits after the decimal point."
  - name: format_compact
    description: "Compact SI notation: 1.2k, 3.4M."
    arguments:
      - name: decimals
        type: int
        description: "Digits after the decimal point."
  - name: format_date
    description: "A date or timestamp from a d3 time format string."
    arguments:
      - name: pattern
        type: string
        description: "A d3 format string (numbers) or d3 time format (dates)."
  - name: add_column
    description: "Registers a field as a column on an element and returns its column id. For writing your own element macros."
    arguments:
      - name: columns
        type: any
        description: "The element's column list, mutated in place."
      - name: element_id
        type: string
        description: "Id of the element the column belongs to."
      - name: f
        type: any
        description: "A field (string or `field()`)."
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: where
        type: string
        description: "Name of the calling macro, for error messages."
      - name: role
        type: string
        description: "The Sigma channel the column feeds (x, y, color, ...); part of the column id."
  - name: add_columns
    description: "`add_column` for a list of fields; returns the list of column ids in order."
    arguments:
      - name: columns
        type: any
        description: "The element's column list, mutated in place."
      - name: element_id
        type: string
        description: "Id of the element the column belongs to."
      - name: fields
        type: list[any]
        description: "A list of fields."
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: where
        type: string
        description: "Name of the calling macro, for error messages."
      - name: role
        type: string
        description: "The Sigma channel the column feeds (x, y, color, ...); part of the column id."
  - name: normalize_field
    description: "Turns a string or `field()` into a field dict with a resolved Sigma formula."
    arguments:
      - name: f
        type: any
        description: "A field (string or `field()`)."
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: where
        type: string
        description: "Name of the calling macro, for error messages."

  # ------------------------------------------------------------ elements
  - name: kpi
    description: "A KPI tile, optionally compared with a target measure (`compare_to`) or with the previous period (`timeline` + `period`), with an optional sparkline."
    arguments:
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: value
        type: any
        description: "The measure, as a field."
      - name: name
        type: string
        description: "Name shown on the element (and, with `key`, the source of its stable id)."
      - name: key
        type: string
        description: "Identity the element's id is derived from; defaults to the name. Set it when two elements share a name, or to keep an id stable across a rename."
      - name: h
        type: any
        description: "Height in pixels, or `fill` for the rest of the page (directly on a page only). Text, titles and headings default to none: sized from their content."
      - name: format
        type: any
        description: "A `sigma_report.format_*()` result applied to the value."
      - name: compare_to
        type: any
        description: "A measure to compare the value against ('vs plan')."
      - name: compare_label
        type: string
        description: "Label for the comparison."
      - name: timeline
        type: any
        description: "A date field; the KPI becomes the latest period's value compared with the one before."
      - name: period
        type: string
        description: "Period for the timeline: year, quarter, month, week, day."
      - name: trend
        type: bool
        description: "Show a sparkline (needs `timeline`)."
      - name: direction
        type: string
        description: "Which way is good: `higher`, `lower` or `none`."
      - name: description
        type: string
        description: "Text shown under the value."
      - name: style
        type: any
        description: "Overrides the default card look (a Sigma `style` mapping)."
  - name: bar_chart
    description: "A bar chart. Sorted by its first measure, descending, unless told otherwise."
    arguments:
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: x
        type: any
        description: "The category or time axis, as a field."
      - name: y
        type: any
        description: "The measure, or a list of measures."
      - name: color
        type: any
        description: "Field to split series by; omitted means every mark takes the theme's `series` color."
      - name: name
        type: string
        description: "Name shown on the element (and, with `key`, the source of its stable id)."
      - name: key
        type: string
        description: "Identity the element's id is derived from; defaults to the name. Set it when two elements share a name, or to keep an id stable across a rename."
      - name: h
        type: any
        description: "Height in pixels, or `fill` for the rest of the page (directly on a page only). Text, titles and headings default to none: sized from their content."
      - name: description
        type: string
        description: "Description text."
      - name: sort_by
        type: any
        description: "`x`, `y`, or a field to sort the axis by."
      - name: sort_direction
        type: string
        description: "`asc` or `desc`."
      - name: stacking
        type: string
        description: "`stacked` or `normalized` (bar and area)."
      - name: labels
        type: bool
        description: "Show data labels."
      - name: legend
        type: bool
        description: "`false` hides the legend."
      - name: horizontal
        type: bool
        description: "Horizontal bars."
      - name: style
        type: any
        description: "Overrides the default card look (a Sigma `style` mapping)."
  - name: line_chart
    description: "A line chart."
    arguments:
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: x
        type: any
        description: "The category or time axis, as a field."
      - name: y
        type: any
        description: "The measure, or a list of measures."
      - name: color
        type: any
        description: "Field to split series by; omitted means every mark takes the theme's `series` color."
      - name: name
        type: string
        description: "Name shown on the element (and, with `key`, the source of its stable id)."
      - name: key
        type: string
        description: "Identity the element's id is derived from; defaults to the name. Set it when two elements share a name, or to keep an id stable across a rename."
      - name: h
        type: any
        description: "Height in pixels, or `fill` for the rest of the page (directly on a page only). Text, titles and headings default to none: sized from their content."
      - name: description
        type: string
        description: "Description text."
      - name: sort_by
        type: any
        description: "`x`, `y`, or a field to sort the axis by."
      - name: sort_direction
        type: string
        description: "`asc` or `desc`."
      - name: labels
        type: bool
        description: "Show data labels."
      - name: legend
        type: bool
        description: "`false` hides the legend."
      - name: style
        type: any
        description: "Overrides the default card look (a Sigma `style` mapping)."
  - name: area_chart
    description: "An area chart."
    arguments:
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: x
        type: any
        description: "The category or time axis, as a field."
      - name: y
        type: any
        description: "The measure, or a list of measures."
      - name: color
        type: any
        description: "Field to split series by; omitted means every mark takes the theme's `series` color."
      - name: name
        type: string
        description: "Name shown on the element (and, with `key`, the source of its stable id)."
      - name: key
        type: string
        description: "Identity the element's id is derived from; defaults to the name. Set it when two elements share a name, or to keep an id stable across a rename."
      - name: h
        type: any
        description: "Height in pixels, or `fill` for the rest of the page (directly on a page only). Text, titles and headings default to none: sized from their content."
      - name: description
        type: string
        description: "Description text."
      - name: sort_by
        type: any
        description: "`x`, `y`, or a field to sort the axis by."
      - name: sort_direction
        type: string
        description: "`asc` or `desc`."
      - name: stacking
        type: string
        description: "`stacked` or `normalized` (bar and area)."
      - name: labels
        type: bool
        description: "Show data labels."
      - name: legend
        type: bool
        description: "`false` hides the legend."
      - name: style
        type: any
        description: "Overrides the default card look (a Sigma `style` mapping)."
  - name: scatter_chart
    description: "A scatter chart; `x` and `y` are both measures and `size` optionally scales the marks."
    arguments:
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: x
        type: any
        description: "A measure."
      - name: y
        type: any
        description: "A measure."
      - name: color
        type: any
        description: "Field to split series by; omitted means every mark takes the theme's `series` color."
      - name: size
        type: any
        description: "A field that scales scatter marks."
      - name: name
        type: string
        description: "Name shown on the element (and, with `key`, the source of its stable id)."
      - name: key
        type: string
        description: "Identity the element's id is derived from; defaults to the name. Set it when two elements share a name, or to keep an id stable across a rename."
      - name: h
        type: any
        description: "Height in pixels, or `fill` for the rest of the page (directly on a page only). Text, titles and headings default to none: sized from their content."
      - name: description
        type: string
        description: "Description text."
      - name: legend
        type: bool
        description: "`false` hides the legend."
      - name: style
        type: any
        description: "Overrides the default card look (a Sigma `style` mapping)."
  - name: pie_chart
    description: "A pie chart: `category` is the slice field, `value` the measure."
    arguments:
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: category
        type: any
        description: "The slice field."
      - name: value
        type: any
        description: "The measure, as a field."
      - name: name
        type: string
        description: "Name shown on the element (and, with `key`, the source of its stable id)."
      - name: key
        type: string
        description: "Identity the element's id is derived from; defaults to the name. Set it when two elements share a name, or to keep an id stable across a rename."
      - name: h
        type: any
        description: "Height in pixels, or `fill` for the rest of the page (directly on a page only). Text, titles and headings default to none: sized from their content."
      - name: description
        type: string
        description: "Description text."
      - name: labels
        type: bool
        description: "Show data labels."
      - name: legend
        type: bool
        description: "`false` hides the legend."
      - name: style
        type: any
        description: "Overrides the default card look (a Sigma `style` mapping)."
  - name: donut_chart
    description: "A donut chart: like a pie, plus an optional `hole_value` measure shown in the middle."
    arguments:
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: category
        type: any
        description: "The slice field."
      - name: value
        type: any
        description: "The measure, as a field."
      - name: hole_value
        type: any
        description: "A measure shown in the donut's hole."
      - name: name
        type: string
        description: "Name shown on the element (and, with `key`, the source of its stable id)."
      - name: key
        type: string
        description: "Identity the element's id is derived from; defaults to the name. Set it when two elements share a name, or to keep an id stable across a rename."
      - name: h
        type: any
        description: "Height in pixels, or `fill` for the rest of the page (directly on a page only). Text, titles and headings default to none: sized from their content."
      - name: description
        type: string
        description: "Description text."
      - name: labels
        type: bool
        description: "Show data labels."
      - name: legend
        type: bool
        description: "`false` hides the legend."
      - name: style
        type: any
        description: "Overrides the default card look (a Sigma `style` mapping)."
  - name: table
    description: "A table element. Sigma tables do not paginate: they show the first `rows` rows of the sort order, so `rows` (or `h`) sets the height."
    arguments:
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: columns
        type: any
        description: "Fields shown, in order (a table); or an element's column list (`add_column`)."
      - name: name
        type: string
        description: "Name shown on the element (and, with `key`, the source of its stable id)."
      - name: key
        type: string
        description: "Identity the element's id is derived from; defaults to the name. Set it when two elements share a name, or to keep an id stable across a rename."
      - name: rows
        type: int
        description: "Data rows shown (default 10). Sigma tables do not paginate: they show as many rows as their height allows, so this sets the height."
      - name: h
        type: any
        description: "Height in pixels, or `fill` for the rest of the page. Overrides `rows`."
      - name: sort
        type: list[any]
        description: "Sort items: a field, or a (field, 'asc'|'desc') pair."
      - name: window
        type: list[any]
        description: "[first, last] row numbers (1-based, inclusive) to show: a hidden RowNumber() column with a range filter."
      - name: description
        type: string
        description: "Description text."
      - name: style
        type: any
        description: "Overrides the default card look (a Sigma `style` mapping)."
