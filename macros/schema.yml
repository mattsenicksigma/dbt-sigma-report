      - name: name
        type: string
        description: "Used for the id when `key` is none."
      - name: h
        type: any
        description: "Height in pixels, or `fill` for the rest of the page (directly on a page only). Text, titles and headings default to none: sized from their content."
  - name: card_style
    description: "The default card look of a data element (white surface, hairline border), or the `style` passed in. `none` when the theme has `cards: false`."
    arguments:
      - name: style
        type: any
        description: "Overrides the default card look (a Sigma `style` mapping)."

  # ------------------------------------------------------------ components
  - name: report_header
    description: "A title block: the title, a muted subtitle and a rule. Returns a list of blocks."
    arguments:
      - name: title
        type: string
        description: "Title text."
      - name: subtitle
        type: string
        description: "Muted text under the title."
      - name: key
        type: string
        description: "Identity for the title's id; defaults to the title."
  - name: section
    description: "A heading followed by its blocks. Returns a list of blocks."
    arguments:
      - name: heading
        type: string
        description: "Heading text."
      - name: blocks
        type: list[any]
        description: "Elements, rows and/or lists of them, in reading order. Must not be empty."
      - name: key
        type: string
        description: "Identity for the heading's id; defaults to the heading."
  - name: kpi_row
    description: "A band of KPI tiles sharing the page width equally."
    arguments:
      - name: kpis
        type: list[any]
        description: "List of KPI mappings (see `kpi_from_spec`)."
      - name: gap
        type: int
        description: "Space between tiles in pixels. Defaults to the report's gap."
  - name: grid
    description: "Groups elements into rows of `per_row`, so a list of charts becomes a tidy grid; a short last row keeps the same cell width."
    arguments:
      - name: elements
        type: list[any]
        description: "Elements and/or lists of elements."
      - name: per_row
        type: int
        description: "Elements per row."
      - name: gap
        type: int
        description: "Space between cells in pixels. Defaults to the report's gap."
  - name: kpi_from_spec
    description: "Builds a KPI from a mapping whose keys are `sigma_report.kpi`'s arguments. The calling convention `simple_dashboard` uses."
    arguments:
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: spec
        type: any
        description: "A report spec built by `report()` (or a `simple_*` composite); for `*_from_spec`, a mapping of that macro's arguments."
  - name: chart_from_spec
    description: "Builds a chart from a mapping: `type` (bar, line, area, scatter, pie, donut) plus that chart macro's arguments."
    arguments:
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: spec
        type: any
        description: "A report spec built by `report()` (or a `simple_*` composite); for `*_from_spec`, a mapping of that macro's arguments."
  - name: report_from_args
    description: "Assembles blocks into a one-page, paginating report. The shared tail of the `simple_*` composites."
    arguments:
      - name: name
        type: string
        description: "Name shown on the element (and, with `key`, the source of its stable id)."
      - name: blocks
        type: list[any]
        description: "Elements, rows and/or lists of them, in reading order. Must not be empty."
      - name: args
        type: dict[string,any]
        description: "A mapping of `sigma_report.report()` arguments (see `report_args`)."
  - name: simple_dashboard
    description: "A complete one-page dashboard from data alone: title, KPI band, chart rows and a detail table. Returns a finished report spec, ready for `materialize()`."
    arguments:
      - name: name
        type: string
        description: "Report name (also the page's name and the title)."
      - name: source
        type: any
        description: "Where the rows come from (see `from_ref`)."
      - name: subtitle
        type: string
        description: "Muted text under the title."
      - name: kpis
        type: list[any]
        description: "List of KPI mappings (see `kpi_from_spec`)."
      - name: charts
        type: list[any]
        description: "List of chart mappings (see `chart_from_spec`)."
      - name: charts_per_row
        type: int
        description: "How many charts share a row."
      - name: table_columns
        type: list[any]
        description: "Fields for a detail table; omit for no table."
      - name: table_name
        type: string
        description: "The table's display name in the data model, if it was given a custom `display_name`."
      - name: table_rows
        type: int
        description: "Rows shown in the detail table (sets its height)."
      - name: table_h
        type: any
        description: "Pixel height or `fill` for the detail table; overrides `table_rows`."
      - name: table_page_count
        type: int
        description: "Run the detail table over this many pages of `table_rows` rows (needs `table_sort`)."
      - name: table_sort
        type: list[any]
        description: "Sort for the detail table: fields or (field, 'asc'|'desc') pairs."
      - name: report_args
        type: dict[string,any]
        description: "Any `sigma_report.report()` argument as a mapping: theme, folder_id, report_id, description, page_size, orientation, margin, gap, header, footer, header_height, footer_height."
  - name: simple_leaderboard
    description: "A ranking report: a KPI for the overall measure and one ranked horizontal bar chart per dimension. Returns a finished report spec."
    arguments:
      - name: name
        type: string
        description: "Name shown on the element (and, with `key`, the source of its stable id)."
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: dimensions
        type: list[any]
        description: "Fields to rank by; each gets its own bar chart."
      - name: measure
        type: string
        description: "The measure to rank, as a formula."
      - name: measure_name
        type: string
        description: "Display name of the measure."
      - name: subtitle
        type: string
        description: "Muted text under the title."
      - name: measure_format
        type: any
        description: "A `sigma_report.format_*()` result for the measure."
      - name: bar_h
        type: int
        description: "Height of each ranked bar chart in pixels."
      - name: report_args
        type: dict[string,any]
        description: "Any `sigma_report.report()` argument as a mapping: theme, folder_id, report_id, description, page_size, orientation, margin, gap, header, footer, header_height, footer_height."

  # ------------------------------------------------------------ presets
  - name: facts_line
    description: "One line of label / value facts (statement number, customer, due date), shown as bold label then value."
    arguments:
      - name: facts
        type: list[any]
        description: "A list of [label, value] pairs, shown in order."
      - name: key
        type: string
        description: "Gives the element a stable id; use distinct keys if you add more than one."
  - name: bullet_list
    description: "A bulleted text block sized to its number of lines."
    arguments:
      - name: lines
        type: any
        description: "A string or a list of strings, one bullet each."
      - name: key
        type: string
        description: "Gives the element a stable id."
      - name: h
        type: int
        description: "Height in pixels; defaults to the line count."
  - name: simple_executive_summary
    description: "A one-page executive summary: headline KPIs, one full-width chart and a bulleted highlights section. Returns a finished report spec."
    arguments:
      - name: name
        type: string
        description: "Report name; also its page name and the source of its stable ids."
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: kpis
        type: list[any]
        description: "KPI mappings (see `kpi_from_spec`); keep it to three or four. Required."
      - name: chart
        type: dict[string,any]
        description: "One chart mapping (see `chart_from_spec`), shown full width."
      - name: highlights
        type: any
        description: "A string or list of strings shown as bullets."
      - name: highlights_heading
        type: string
        description: "Heading above the highlights."
      - name: subtitle
        type: string
        description: "Muted text under the title."
      - name: chart_h
        type: int
        description: "Height of the chart in pixels."
      - name: report_args
        type: dict[string,any]
        description: "Any `sigma_report.report()` argument as a mapping: theme, folder_id, report_id, description, page_size, orientation, margin, gap, header, footer, header_height, footer_height."
  - name: simple_period_review
    description: "A recurring period review: KPIs compared with the previous period, a trend, a breakdown per dimension and notes. Returns a finished report spec."
    arguments:
      - name: name
        type: string
        description: "Report name; also its page name and the source of its stable ids."
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: date_field
        type: string
        description: "The date every KPI is compared over and the trend chart axis."
      - name: kpis
        type: list[any]
        description: "KPI mappings (see `kpi_from_spec`); the first one drives the trend and breakdown charts. Required."
      - name: period
        type: string
        description: "A DateTrunc unit: day, week, month, quarter or year."
      - name: breakdowns
        type: list[any]
        description: "Dimension fields; each becomes a ranked bar chart of the first KPI."
      - name: notes
        type: any
        description: "A string or list of strings shown as bullets under the notes heading."
      - name: notes_heading
        type: string
        description: "Heading above the notes."
      - name: subtitle
        type: string
        description: "Muted text under the title."
      - name: trend_h
        type: int
        description: "Height of the trend chart in pixels."
      - name: chart_h
        type: int
        description: "Height of each breakdown chart in pixels."
      - name: report_args
        type: dict[string,any]
        description: "Any `sigma_report.report()` argument as a mapping: theme, folder_id, report_id, description, page_size, orientation, margin, gap, header, footer, header_height, footer_height."
  - name: simple_statement
    description: "A statement or invoice: a facts line, a line-item table, a totals band and a footer note. Returns a finished report spec."
    arguments:
      - name: name
        type: string
        description: "Report name; also its page name and the source of its stable ids."
      - name: source
        type: any
        description: "Where the rows come from: a `from_ref` / `from_source` / `from_data_model` / `warehouse_table` source, or another element."
      - name: columns
        type: list[any]
        description: "Fields of the line-item table, in order. Required."
      - name: facts
        type: list[any]
        description: "A list of [label, value] pairs shown above the table (see `facts_line`)."
      - name: totals
        type: list[any]
        description: "KPI mappings shown in a band under the table."
      - name: footer_note
        type: string
        description: "Plain text below the totals."
      - name: rows_name
        type: string
        description: "Name of the line-item table."
      - name: rows_h
        type: int
        description: "Height reserved for the table in pixels; a block must fit on one page."
      - name: rows_sort
        type: list[any]
        description: "Table sort: a field, or a (field, asc|desc) pair, per item."
      - name: subtitle
        type: string
        description: "Muted text under the title."
      - name: report_args
        type: dict[string,any]
        description: "Any `sigma_report.report()` argument as a mapping: theme, folder_id, report_id, description, page_size, orientation, margin, gap, header, footer, header_height, footer_height."

  # ------------------------------------------------------------ theme
  - name: theme
    description: "The fully-resolved theme (every token as a hex string): defaults, then the `sigma_report_theme` project var, then the override passed here."
    arguments:
      - name: override
        type: dict[string,any]
        description: "Theme overrides layered on top of the project var."
  - name: theme_config
    description: "The merged theme settings before token expansion."
    arguments:
      - name: override
        type: dict[string,any]
        description: "Theme overrides layered on top of the project var."
  - name: default_theme
    description: "The package's default theme: Sigma's Neutral base and Blue hue."
  - name: base_palettes
    description: "The neutral scales a theme's `base` can name: Neutral, Stone, Zinc, Slate."
  - name: hue_palettes
    description: "The accent scales a theme's `hue` can name: Neutral, Blue, Indigo, Violet, Emerald, Teal, Green, Rose, Orange, Amber."
  - name: color
    description: "Resolves a design token (or hex) to a hex string. Raises on an unknown token."
    arguments:
      - name: token
        type: string
        description: "A color token or a hex value."
      - name: override
        type: dict[string,any]
        description: "Theme overrides layered on top of the project var."
  - name: color_ref
    description: "A late-bound color marker that `report()` resolves against the final theme, so a report-level theme recolors elements built earlier."
    arguments:
      - name: token
        type: string
        description: "A color token (`primary`, `ink`, ...) or a hex value."
  - name: theme_settings
    description: "The theme as the `settings` block of a report's `contents`."
    arguments:
      - name: override
        type: dict[string,any]
        description: "Theme overrides layered on top of the project var."

  # ------------------------------------------------------------ settings
  - name: settings
    description: "The effective project settings: package defaults deep-merged with the `sigma_report_settings` project var. Unknown keys fail."
  - name: setting
    description: "One setting by name; a non-none `value` wins, which is how an argument that defaults to the project setting is written."
    arguments:
      - name: name
        type: string
        description: "The setting's name (see `default_settings`)."
      - name: value
        type: any
        description: "An explicit value; when not none it wins over the project setting."
  - name: default_settings
    description: "The package's default sizes and calibration constants (page size, margins, element heights, text and table metrics)."

  # ------------------------------------------------------------ utilities
  - name: freeze_id
    description: "A deterministic id: the md5 of a stable path, truncated to `length` characters."
    arguments:
      - name: path
        type: any
        description: "Stable path string to hash."
      - name: length
        type: int
        description: "Characters to keep."
  - name: titleize
    description: "`snake_case` to `Title Case`, leaving anything with an uppercase letter untouched."
    arguments:
      - name: value
        type: any
        description: "The text to title-case."
  - name: compact
    description: "Drops keys whose value is none."
    arguments:
      - name: mapping
        type: dict[string,any]
        description: "The mapping to drop none values from."
  - name: deep_merge
    description: "Recursive dict merge; `override` wins and nested mappings merge."
    arguments:
      - name: base
        type: dict[string,any]
        description: "The mapping to merge onto."
      - name: override
        type: dict[string,any]
        description: "Theme overrides layered on top of the project var."
  - name: flatten
    description: "One level of flattening: [a, [b, c]] -> [a, b, c]."
    arguments:
      - name: items
        type: list[any]
        description: "A list of items and/or lists."
  - name: fail
    description: "Raises a compiler error prefixed with the calling macro's name."
    arguments:
      - name: where
        type: string
        description: "Macro name to prefix the message with."
      - name: message
        type: string
        description: "The error message."
  - name: strip_private
    description: "Recursively drops every `_`-prefixed key."
    arguments:
      - name: value
        type: any
        description: "Any structure."
  # ------------------------------------------------------------ actions
  - name: button
    description: "A button. Give it `actions=` to make it do something; see `action` and the effect macros."
    arguments:
      - name: text
        type: string
        description: "The button label."
      - name: actions
        type: list[any]
        description: "`action(...)` results to attach."
      - name: key
        type: string
        description: "Identity the element's id is derived from; defaults to the name."
      - name: h
        type: any
        description: "Height in pixels, or none for the project's `button_h` setting."
      - name: appearance
        type: string
        description: "`filled`, `outline` or `text`."
      - name: align
        type: string
        description: "`left`, `center`, `right` or `stretch`."
      - name: size
        type: string
        description: "`small`, `medium` or `large`."
      - name: radius
        type: string
        description: "Corner style: `square`, `round` or `pill`."
  - name: action_triggers
    description: "The triggers Sigma accepts as a bare string (on-click, on-select, on-change, ...)."
  - name: action
    description: "One action sequence: a trigger and the effects that run, in order, when it fires. Attach it with `button(actions=)` or `with_actions`."
    arguments:
      - name: trigger
        type: any
        description: "A trigger string (see `action_triggers`), or a mapping with an `on` key (an `on-select` scoped to a column, or with a `condition`) used as written."
      - name: effects
        type: list[any]
        description: "Effects built by the effect macros, or by `effect()`."
      - name: key
        type: string
        description: "Keeps the action's id stable if you reorder a list of them; defaults to its position."
  - name: with_actions
    description: "Attaches actions to any element (a macro's result or `raw()`). Updates the element in place and returns it; calling it again appends. Ids come from the element id, the trigger and the action's key or position."
    arguments:
      - name: el
        type: dict[string,any]
        description: "An element built by a sigma_report macro."
      - name: actions
        type: list[any]
        description: "`action(...)` results."
  - name: effect
    description: "An effect of any kind, with Sigma's own fields (call-api, insert-rows, update-rows, send-embed-event, if-else, ...)."
    arguments:
      - name: name
        type: string
        description: "Sigma's effect name, e.g. `call-api`."
      - name: properties
        type: dict[string,any]
        description: "Sigma's own fields for that effect, used as written."
  - name: set_control_value
    description: "Effect: set a control to a value."
    arguments:
      - name: control
        type: any
        description: "The control's id (or an element carrying one)."
      - name: value
        type: any
        description: "A string, number, boolean or list of strings (typed for you), or a Sigma value mapping used as written."
  - name: clear_control
    description: "Effect: clear one control."
    arguments:
      - name: control
        type: any
        description: "The control's id."
  - name: clear_controls
    description: "Effect: clear many controls at once."
    arguments:
      - name: scope
        type: string
        description: "`workbook` (the whole report), `page` or `container`."
      - name: page
        type: any
        description: "With scope `page`: the page (a `page()` result or id); omit for the current page."
      - name: container
        type: any
        description: "With scope `container`: the container element or its id."
  - name: open_url
    description: "Effect: open a URL. Supports `{{formula}}` segments."
    arguments:
      - name: url
        type: string
        description: "The URL."
      - name: target
        type: string
        description: "`_blank` (new tab), `_self` or `_parent`."
  - name: navigate
    description: "Effect: jump to a page or to an element. Pass exactly one of `page` / `element`."
    arguments:
      - name: page
        type: any
        description: "A `page()` result or page id."
      - name: element
        type: any
        description: "An element or its id."
  - name: refresh_element
    description: "Effect: re-run an element's query."
    arguments:
      - name: element
        type: any
        description: "An element or its id."
  - name: download
    description: "Effect: download the report, one page or one element."
    arguments:
      - name: format
        type: string
        description: "`csv`, `excel`, `json`, `pdf` or `png`."
      - name: page
        type: any
        description: "Export one page (a `page()` result or id)."
      - name: element
        type: any
        description: "Export one element (or its id). With neither, everything is exported."
      - name: layout
        type: string
        description: "PDF only: `portrait` or `landscape`."
      - name: page_size
        type: string
        description: "PDF only: letter, legal, tabloid or a0-a4."
  - name: schedule
    description: "A scheduled PDF export of the report. Not part of the report's contents: it is carried on the spec (`report(schedules=)`) and applied by `scripts/export_reports.py --push`, matched to Sigma's by name."
    arguments:
      - name: name
        type: string
        description: "The schedule's title in Sigma; also how a re-push finds the schedule to update."
      - name: cron
        type: string
        description: "A 5-field cron expression, e.g. `0 8 * * 1`."
      - name: to
        type: list[any]
        description: "Recipients: an email address, or a Sigma target mapping (`teamId`, `slackConversationId`, `webhookUrl`, ...) used as written."
      - name: timezone
        type: string
        description: "IANA timezone name."
      - name: message
        type: string
        description: "Message body."
      - name: layout
        type: string
        description: "PDF layout: `portrait` or `landscape`."
      - name: scale
        type: any
        description: "PDF scale factor."
      - name: include_link
        type: bool
        description: "Include a link back to the report."
      - name: run_as_recipient
        type: bool
        description: "Run the export as each recipient, so their data permissions apply."
      - name: only_if_not_empty
        type: any
        description: "Only send when this element (or id) has rows."
      - name: only_if_empty
        type: any
        description: "Only send when this element (or id) has no rows."
      - name: options
        type: dict[string,any]
        description: "Sigma's own `configV2` fields, deep-merged on (control values, attachment settings, ...)."
